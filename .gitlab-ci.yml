# -----------------------------------------------------------------------------
# GitLab CI pipeline: запуск UI-тестов и публикация Allure отчёта
# -----------------------------------------------------------------------------

# Определяем стадии пайплайна:
# - test: установка окружения и запуск автотестов
# - report: генерация Allure-отчёта на основе результатов тестов
# - deploy: публикация HTML-отчёта через GitLab Pages
stages:
  - test
  - report
  - deploy


# -----------------------------------------------------------------------------
# Джоба №1 — установка окружения и запуск автотестов
# -----------------------------------------------------------------------------
run-tests:
  stage: test

  # Используем официальный образ Ubuntu.
  # Это даёт возможность устанавливать системные зависимости через apt.
  image: ubuntu:24.04

  # Даже если тесты упадут, пайплайн должен продолжить выполнение.
  # Это необходимо, чтобы Allure-отчёт был опубликован в любом случае.
  allow_failure: true

  # before_script выполняется перед основными командами.
  before_script:
    # ------------------------------------------
    # 1. Подготовка системного окружения
    # ------------------------------------------

    # Обновляем индекс пакетов.
    - apt-get update

    # Устанавливаем необходимые системные компоненты:
    # python3.12           — интерпретатор Python
    # python3.12-venv      — создание виртуальных окружений
    # python3-pip          — менеджер пакетов pip
    - apt-get install -y python3.12 python3.12-venv python3-pip


    # ------------------------------------------
    # 2. Настройка Python-окружения
    # ------------------------------------------

    # Создаём и активируем виртуальное окружение Python.
    - python3.12 -m venv venv
    - source venv/bin/activate

    # Устанавливаем зависимости проекта (pytest, playwright и т.д.).
    - pip install -r requirements.txt

    # Устанавливаем браузеры и их системные зависимости для Playwright.
    - playwright install --with-deps

  # Основной блок: запуск тестов и формирование Allure-результатов
  script:
    # Запускаем тесты. Результаты сохраняются в allure-results/.
    - pytest -m regression --alluredir=allure-results --numprocesses 2

  # Сохраняем сырые результаты тестов как артефакт,
  # чтобы передать их в следующую джобу (publish-report).
  artifacts:
    paths:
      - allure-results/
    expire_in: 7 days       # храним 7 дней
    when: always            # сохраняем даже при падении тестов

  # Запускаем джобу только при пушах в ветку main.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# -----------------------------------------------------------------------------
# Джоба №2 — генерация Allure-отчёта на основе результатов run-tests
# -----------------------------------------------------------------------------
publish-report:
  stage: report

  # Используем официальный образ Ubuntu, так как Allure CLI требует Java,
  # а для скачивания и распаковки архива нужны wget и tar.
  image: ubuntu:24.04

  # Запускаем только после успешной (или упавшей, но завершённой) run-tests
  # и забираем её артефакт allure-results/.
  needs:
    - run-tests

  before_script:
    # ------------------------------------------
    # Установка Allure Commandline
    # ------------------------------------------

    # Обновляем индекс пакетов.
    - apt-get update

    # Устанавливаем Java Runtime (необходим для Allure CLI) и утилиты
    # для скачивания и распаковки архива.
    - apt-get install -y openjdk-11-jre wget tar

    # Скачиваем официальный архив Allure CLI.
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz

    # Распаковываем архив (создаст каталог allure-2.32.0/).
    - tar -xvf allure-2.32.0.tgz

  script:
    # Генерируем HTML-отчёт через Allure CLI на основе allure-results,
    # скачанного как артефакт из джобы run-tests.
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean

  # Сохраняем готовый HTML-отчёт как артефакт,
  # чтобы передать его в следующую джобу (pages).
  artifacts:
    paths:
      - allure-report/
    expire_in: 7 days
    when: always

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# -----------------------------------------------------------------------------
# Джоба №3 — публикация Allure-отчёта на GitLab Pages
# -----------------------------------------------------------------------------
pages:
  stage: deploy

  script:
    # GitLab Pages публикует только директорию public/.
    - mkdir -p public
    - cp -r allure-report/* public/

  artifacts:
    paths:
      - public

  # Выполнять публикацию только после завершения publish-report,
  # чтобы забрать её артефакт allure-report/.
  needs:
    - publish-report

  # Публикуем только из ветки main.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
